<div class="card-container">
  <div class="input-container">
    <input #newItem type="text" placeholder="Enter your name"
      (keyup.enter)="addItem(newItem.value); newItem.value = ''" />
    <button type="button" (click)="addItem(newItem.value); newItem.value = ''">Add</button>
  </div>

  <div>
    <ul>
      @for (item of list; track item) {
        <li>{{ item }}</li>
      }
    </ul>
  </div>
</div>
